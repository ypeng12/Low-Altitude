[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tripadvisor-emotion-transition"
version = "0.1.0"
description = "Auditable emotion and semantic transformation discovery"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2", "pandas>=2,<3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
