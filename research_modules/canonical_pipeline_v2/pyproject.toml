[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "low-altitude-canonical-pipeline"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["pandas>=2.0,<3", "openpyxl>=3.1,<4", "fasttext-wheel>=0.9.2,<0.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
